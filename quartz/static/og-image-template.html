<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Image Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Lora:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 675px;
      background: #f5f0e8;
      font-family: 'Lora', serif;
      overflow: hidden;
      position: relative;
    }

    /* Background accent shapes */
    .bg-circle-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(40,75,99,0.08) 0%, transparent 70%);
      top: -120px;
      right: -80px;
    }

    .bg-circle-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(132,165,157,0.15) 0%, transparent 70%);
      bottom: -60px;
      left: 60px;
    }

    /* Left accent bar */
    .accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 8px;
      height: 100%;
      background: linear-gradient(180deg, #284b63 0%, #84a59d 100%);
    }

    .container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      padding: 0 80px 0 100px;
      gap: 16px;
      justify-content: flex-start;
    }

    /* Left: text content */
    .content {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .label {
      font-family: 'Lora', serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #84a59d;
      margin-bottom: 18px;
    }

    .name {
      font-family: 'Cardo', serif;
      font-size: 72px;
      font-weight: 700;
      color: #2b2b2b;
      line-height: 1.05;
      margin-bottom: 12px;
    }

    .title {
      font-family: 'Lora', serif;
      font-size: 22px;
      color: #284b63;
      font-weight: 400;
      margin-bottom: 32px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 40px;
    }

    .tag {
      background: rgba(40, 75, 99, 0.1);
      color: #284b63;
      border: 1px solid rgba(40, 75, 99, 0.25);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 14px;
      font-family: 'Lora', serif;
      font-weight: 600;
    }

    .url {
      font-family: 'Lora', serif;
      font-size: 16px;
      color: #b8b8b8;
      letter-spacing: 1px;
    }

    /* Right: avatar */
    .avatar-wrap {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid #284b63;
      object-fit: cover;
      background: #e5e5e5;
    }

    /* Divider */
    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #284b63, #84a59d);
      border-radius: 2px;
      margin: 16px 0 20px;
    }
  </style>
</head>
<body>
  <div class="bg-circle-1"></div>
  <div class="bg-circle-2"></div>
  <div class="accent-bar"></div>

  <div class="container">
    <div class="content">
      <div class="label">Personal Site</div>
      <div class="name">Hoai-Chau Tran</div>
      <div class="divider"></div>
      <div class="title">PhD Student &nbsp;·&nbsp; Computer Science &nbsp;·&nbsp; UIUC</div>
      <!-- <div class="tags"> -->
        <!-- <span class="tag">Efficient Foundation Models</span> -->
        <!-- <span class="tag">Edge AI</span> -->
        <!-- <span class="tag">Generative Models</span> -->
      <!-- </div> -->
      <div class="url">hchautran.github.io</div>
    </div>

    <div class="avatar-wrap">
      <div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:160px;background:transparent;border:0px solid #284b63;">☕</div>
    </div>
  </div>
</body>
</html>
