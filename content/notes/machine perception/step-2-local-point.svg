<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Step 2: describe the point in the body frame</title>
  <desc id="desc">A point displacement is decomposed along the rotated body-frame x and y axes.</desc>
  <defs>
    <marker id="s2-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="s2-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="s2-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="900" height="390" rx="18" fill="#f8fafc"/>
  <text x="42" y="47" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Step 2 · Describe the point relative to the body</text>
  <g transform="translate(235 302) rotate(-25)" font-family="system-ui, sans-serif">
    <circle r="8" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <line x1="0" y1="0" x2="150" y2="0" stroke="#16a34a" stroke-width="5" marker-end="url(#s2-green)"/>
    <line x1="0" y1="0" x2="0" y2="-140" stroke="#2563eb" stroke-width="5" marker-end="url(#s2-blue)"/>
    <text x="160" y="8" font-size="23" font-style="italic" fill="#166534">x<tspan baseline-shift="sub" font-size="14">B</tspan></text>
    <text x="-8" y="-153" font-size="23" font-style="italic" fill="#1d4ed8">y<tspan baseline-shift="sub" font-size="14">B</tspan></text>
  </g>
  <text x="192" y="349" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#334155">Body B</text>
  <line x1="243" y1="296" x2="512" y2="84" stroke="#dc2626" stroke-width="6" marker-end="url(#s2-red)"/>
  <circle cx="522" cy="75" r="12" fill="#dc2626"/>
  <text x="545" y="82" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#991b1b">point p</text>
  <path d="M239 298 L548 176" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M548 176 L522 75" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 7"/>
  <rect x="578" y="124" width="264" height="116" rx="13" fill="#e2e8f0"/>
  <text x="600" y="158" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Local coordinates</text>
  <text x="600" y="190" font-family="system-ui, sans-serif" font-size="17" fill="#475569">measure the displacement</text>
  <text x="600" y="217" font-family="system-ui, sans-serif" font-size="17" fill="#475569">along the body axes.</text>
  <text x="450" y="373" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#475569">The red arrow begins at the body origin—not at the world origin.</text>
</svg>
