<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Step 1: locate the body origin</title>
  <desc id="desc">An orange translation vector runs from the world origin to the body origin.</desc>
  <defs>
    <marker id="s1-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="s1-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="s1-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
  </defs>
  <rect width="900" height="360" rx="18" fill="#f8fafc"/>
  <text x="42" y="47" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Step 1 · Locate the body origin</text>
  <g transform="translate(120 286)" font-family="system-ui, sans-serif">
    <circle r="7" fill="#0f172a"/>
    <line x1="0" y1="0" x2="125" y2="0" stroke="#16a34a" stroke-width="5" marker-end="url(#s1-green)"/>
    <line x1="0" y1="0" x2="0" y2="-115" stroke="#2563eb" stroke-width="5" marker-end="url(#s1-blue)"/>
    <text x="134" y="8" font-size="23" font-style="italic" fill="#166534">x<tspan baseline-shift="sub" font-size="14">W</tspan></text>
    <text x="-8" y="-128" font-size="23" font-style="italic" fill="#1d4ed8">y<tspan baseline-shift="sub" font-size="14">W</tspan></text>
    <text x="-45" y="43" font-size="19" font-weight="650" fill="#334155">World W</text>
  </g>
  <line x1="128" y1="282" x2="644" y2="122" stroke="#ea580c" stroke-width="7" marker-end="url(#s1-orange)"/>
  <rect x="326" y="180" width="158" height="38" rx="10" fill="#ffedd5"/>
  <text x="405" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="650" fill="#9a3412">translation vector</text>
  <circle cx="660" cy="117" r="11" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
  <text x="682" y="124" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#334155">body origin</text>
  <rect x="525" y="254" width="324" height="67" rx="12" fill="#e2e8f0"/>
  <text x="687" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#475569">This answers “Where is frame B?”</text>
  <text x="687" y="307" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#475569">The point has not been considered yet.</text>
</svg>
