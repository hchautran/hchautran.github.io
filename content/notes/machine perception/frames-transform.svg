<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Transforming a point from body coordinates to world coordinates</title>
  <desc id="desc">The world-to-body translation plus the rotated body-frame displacement equals the point's world-frame position.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="960" height="540" rx="18" fill="#f8fafc"/>
  <text x="52" y="52" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#0f172a">A rigid transform as vector addition</text>
  <text x="52" y="82" font-family="system-ui, sans-serif" font-size="18" fill="#475569">The physical point is fixed; only its coordinate description changes.</text>

  <line x1="130" y1="430" x2="744" y2="126" stroke="#7c3aed" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#arrow-purple)"/>
  <rect x="334" y="222" width="132" height="34" rx="9" fill="#ede9fe"/>
  <text x="400" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="650" fill="#6d28d9">world position</text>

  <g transform="translate(130 430)" font-family="system-ui, sans-serif">
    <circle r="7" fill="#0f172a"/>
    <line x1="0" y1="0" x2="135" y2="0" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
    <line x1="0" y1="0" x2="0" y2="-128" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
    <text x="144" y="8" font-size="24" font-style="italic" fill="#166534">x<tspan baseline-shift="sub" font-size="15">W</tspan></text>
    <text x="-8" y="-141" font-size="24" font-style="italic" fill="#1d4ed8">y<tspan baseline-shift="sub" font-size="15">W</tspan></text>
    <text x="-48" y="48" font-size="20" font-weight="650" fill="#334155">World W</text>
  </g>

  <line x1="137" y1="427" x2="468" y2="311" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow-orange)"/>
  <rect x="252" y="348" width="112" height="34" rx="9" fill="#ffedd5"/>
  <text x="308" y="371" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="650" fill="#9a3412">translation</text>

  <g transform="translate(480 306) rotate(-28)" font-family="system-ui, sans-serif">
    <circle r="8" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <line x1="0" y1="0" x2="125" y2="0" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
    <text x="134" y="8" font-size="24" font-style="italic" fill="#166534">x<tspan baseline-shift="sub" font-size="15">B</tspan></text>
    <text x="-7" y="-134" font-size="24" font-style="italic" fill="#1d4ed8">y<tspan baseline-shift="sub" font-size="15">B</tspan></text>
  </g>
  <text x="443" y="350" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#334155">Body B</text>

  <line x1="487" y1="299" x2="748" y2="121" stroke="#dc2626" stroke-width="6" marker-end="url(#arrow-red)"/>
  <rect x="545" y="181" width="214" height="34" rx="9" fill="#fee2e2"/>
  <text x="652" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="650" fill="#991b1b">rotated local displacement</text>

  <circle cx="760" cy="113" r="13" fill="#dc2626"/>
  <text x="783" y="120" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#991b1b">point p</text>

  <rect x="548" y="396" width="348" height="92" rx="13" fill="#e2e8f0"/>
  <circle cx="577" cy="425" r="7" fill="#ea580c"/>
  <text x="596" y="431" font-family="system-ui, sans-serif" font-size="17" fill="#334155">world origin → body origin</text>
  <circle cx="577" cy="458" r="7" fill="#dc2626"/>
  <text x="596" y="464" font-family="system-ui, sans-serif" font-size="17" fill="#334155">body origin → physical point</text>
</svg>
