<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Transforming a body-frame point into world coordinates</title><desc id="desc">An Excalidraw-style vector diagram with labels placed in separate clear regions.</desc>
<defs>
 <marker id="black" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker>
 <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#f08c00" stroke-width="1.5"/></marker>
 <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#e03131" stroke-width="1.5"/></marker>
 <marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#7950f2" stroke-width="1.5"/></marker>
 <style>@font-face{font-family:Excalifont;src:url("Excalifont-Latin.woff2")}@font-face{font-family:Excalifont;src:url("Excalifont-Greek.woff2")}.sk{font-family:Excalifont,"Comic Sans MS",sans-serif;fill:#1e1e1e}.math{font-family:Georgia,"Times New Roman",serif;fill:#1e1e1e}.ink{fill:none;stroke:#1e1e1e;stroke-width:2;stroke-linecap:round}.ghost{fill:none;stroke:#1e1e1e;stroke-width:1;opacity:.35}.tr{fill:none;stroke:#f08c00;stroke-width:2.4;stroke-linecap:round}.sum{fill:none;stroke:#7950f2;stroke-width:2.2;stroke-linecap:round}.rd{fill:none;stroke:#e03131;stroke-width:2.4;stroke-linecap:round}</style>
</defs>
<rect width="1000" height="600" fill="#fff"/><text class="sk" x="45" y="48" font-size="29">One point, two coordinate descriptions</text>

<!-- world frame -->
<g transform="translate(135 420)"><circle r="5" fill="#1e1e1e"/><path class="ghost" d="M0 0L135 0M0 0L0-125" transform="translate(2 1)"/><path class="ink" d="M0 0L135 0" marker-end="url(#black)"/><path class="ink" d="M0 0L0-125" marker-end="url(#black)"/><text class="math" x="147" y="8" font-size="24">x<tspan baseline-shift="sub" font-size="14">W</tspan></text><text class="math" x="-10" y="-139" font-size="24">y<tspan baseline-shift="sub" font-size="14">W</tspan></text><text class="sk" x="-45" y="48" font-size="23">World W</text></g>

<!-- body frame -->
<g transform="translate(500 260) rotate(-25)"><circle r="6" fill="#1e1e1e"/><path class="ghost" d="M0 0L130 0M0 0L0-120" transform="translate(2 1)"/><path class="ink" d="M0 0L130 0" marker-end="url(#black)"/><path class="ink" d="M0 0L0-120" marker-end="url(#black)"/></g>
<text class="math" x="640" y="232" font-size="24">x<tspan baseline-shift="sub" font-size="14">B</tspan></text><text class="math" x="416" y="128" font-size="24">y<tspan baseline-shift="sub" font-size="14">B</tspan></text><text class="sk" x="461" y="306" font-size="23">Body B</text>

<!-- vectors and point -->
<path class="tr" d="M141 415C275 383 380 338 487 269" marker-end="url(#orange)"/>
<path class="rd" d="M508 253L762 105" marker-end="url(#red)"/>
<path class="sum" d="M141 415L775 98" stroke-dasharray="5 8" marker-end="url(#purple)"/>
<circle cx="780" cy="95" r="9" fill="#e03131"/><circle cx="780" cy="95" r="12" fill="none" stroke="#7950f2" stroke-width="1.2"/><text class="sk" x="807" y="102" font-size="23">physical point p</text>

<!-- protected legend: no formula label is placed on vector geometry -->
<g transform="translate(68 88)">
 <text class="sk" x="0" y="0" font-size="19">vector key</text>
 <path class="tr" d="M0 34L42 34"/><g transform="translate(58 31)" class="math"><text x="0" y="-9" font-size="14">W</text><text x="16" y="4" font-size="23" font-weight="700">t</text><text x="29" y="13" font-size="14">B</text></g>
 <path class="rd" d="M0 76L42 76"/><g transform="translate(58 73)" class="math"><text x="0" y="-9" font-size="14">W</text><text x="16" y="4" font-size="23" font-weight="700">d</text></g>
 <path class="sum" d="M0 118L42 118" stroke-dasharray="5 8"/><g transform="translate(58 115)" class="math"><text x="0" y="-9" font-size="14" fill="#7950f2">W</text><text x="16" y="4" font-size="23" font-weight="700" fill="#7950f2">p</text></g>
</g>

<!-- dedicated equation lane -->
<path d="M275 493C432 490 615 496 771 492" fill="none" stroke="#ced4da" stroke-width="1"/>
<g transform="translate(372 531)" class="math">
 <text x="0" y="-11" font-size="15">W</text><text x="18" y="5" font-size="27" font-weight="700">p</text><text x="44" y="5" font-size="27">=</text>
 <text x="78" y="-11" font-size="15">W</text><text x="96" y="5" font-size="27" font-weight="700">t</text><text x="111" y="14" font-size="15">B</text><text x="137" y="5" font-size="27">+</text>
 <text x="171" y="-11" font-size="15">W</text><text x="189" y="5" font-size="27" font-weight="700">d</text>
</g>
<g transform="translate(338 572)" class="math">
 <text x="0" y="5" font-size="27">=</text><text x="35" y="-11" font-size="15">W</text><text x="53" y="5" font-size="27" font-weight="700">t</text><text x="68" y="14" font-size="15">B</text><text x="94" y="5" font-size="27">+</text>
 <text x="128" y="-11" font-size="15">W</text><text x="146" y="5" font-size="27" font-weight="700">R</text><text x="166" y="14" font-size="15">B</text>
 <text x="193" y="-11" font-size="15">B</text><text x="211" y="5" font-size="27" font-weight="700">p</text>
</g>
</svg>
