<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">A 3D pose has three translations and three rotations</title>
  <desc id="desc">A simple Excalidraw-style figure separates position from roll, pitch, and yaw.</desc>
  <defs>
    <marker id="ink-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#f08c00" stroke-width="1.5"/></marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#e03131" stroke-width="1.5"/></marker>
    <style>
      @font-face{font-family:Excalifont;src:url("Excalifont-Latin.woff2")}@font-face{font-family:Excalifont;src:url("Excalifont-Greek.woff2")}
      .sk{font-family:Excalifont,"Comic Sans MS",sans-serif;fill:#1e1e1e}.math{font-family:Georgia,"Times New Roman",serif;fill:#1e1e1e}.ink{fill:none;stroke:#1e1e1e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#1e1e1e;stroke-width:1;opacity:.32}.orange{fill:none;stroke:#f08c00;stroke-width:2.4;stroke-linecap:round}.red{fill:none;stroke:#e03131;stroke-width:2.2;stroke-linecap:round}.rule{fill:none;stroke:#ced4da;stroke-width:1}
    </style>
  </defs>
  <rect width="1000" height="500" fill="#fff"/>
  <text class="sk" x="45" y="48" font-size="29">A 3D pose = position + orientation</text>

  <!-- position -->
  <text class="sk" x="85" y="103" font-size="25">position</text>
  <g transform="translate(115 330)">
    <circle r="5" fill="#1e1e1e"/>
    <path class="ghost" d="M0 0L105 0M0 0L0-100M0 0L-50 48" transform="translate(2 1)"/>
    <path class="ink" d="M0 0L105 0" marker-end="url(#ink-arrow)"/><path class="ink" d="M0 0L0-100" marker-end="url(#ink-arrow)"/><path class="ink" d="M0 0L-50 48" marker-end="url(#ink-arrow)"/>
    <text class="math" x="116" y="8" font-size="21">x</text><text class="math" x="-8" y="-114" font-size="21">z</text><text class="math" x="-70" y="69" font-size="21">y</text>
  </g>
  <path class="orange" d="M122 324C202 288 276 226 357 165" marker-end="url(#orange-arrow)"/>
  <circle cx="368" cy="157" r="8" fill="#f08c00"/><circle cx="368" cy="157" r="12" fill="none" stroke="#fab005" stroke-width="1.2"/>
  <text class="sk" x="389" y="164" font-size="22">body origin</text>
  <text class="math" x="165" y="205" font-size="21"><tspan font-weight="700">t</tspan><tspan> = [t</tspan><tspan baseline-shift="sub" font-size="13">x</tspan><tspan baseline-shift="baseline">, t</tspan><tspan baseline-shift="sub" font-size="13">y</tspan><tspan baseline-shift="baseline">, t</tspan><tspan baseline-shift="sub" font-size="13">z</tspan><tspan baseline-shift="baseline">]</tspan><tspan baseline-shift="super" font-size="13">T</tspan></text>

  <path class="rule" d="M500 82L498 390"/>

  <!-- orientation -->
  <text class="sk" x="545" y="103" font-size="25">orientation</text>
  <g transform="translate(585 220)">
    <path class="ghost" d="M-34-24L34-24L34 24L-34 24Z" transform="translate(2 -2)"/><path class="ink" d="M-34-24L34-24L34 24L-34 24Z"/>
    <path class="ink" d="M0 0L74 0" marker-end="url(#ink-arrow)"/>
    <path class="red" d="M-6-45C-43-31-43 30-6 45" marker-end="url(#red-arrow)"/>
    <text class="math" x="-27" y="91" font-size="21">roll α</text><text class="sk" x="-22" y="119" font-size="17">about x</text>
  </g>
  <g transform="translate(760 220)">
    <path class="ghost" d="M-34-24L34-24L34 24L-34 24Z" transform="translate(2 -2)"/><path class="ink" d="M-34-24L34-24L34 24L-34 24Z"/>
    <path class="ink" d="M0 0L-53 53" marker-end="url(#ink-arrow)"/>
    <path class="red" d="M-43-17C-17-53 29-48 45-15" marker-end="url(#red-arrow)"/>
    <text class="math" x="-34" y="91" font-size="21">pitch β</text><text class="sk" x="-22" y="119" font-size="17">about y</text>
  </g>
  <g transform="translate(920 220)">
    <path class="ghost" d="M-34-24L34-24L34 24L-34 24Z" transform="translate(2 -2)"/><path class="ink" d="M-34-24L34-24L34 24L-34 24Z"/>
    <path class="ink" d="M0 0L0-74" marker-end="url(#ink-arrow)"/>
    <path class="red" d="M-42 32C-70 3-63-38-32-54" marker-end="url(#red-arrow)"/>
    <text class="math" x="-30" y="91" font-size="21">yaw γ</text><text class="sk" x="-22" y="119" font-size="17">about z</text>
  </g>

  <!-- exact article formula -->
  <path class="rule" d="M245 415C405 412 586 418 750 414"/>
  <text class="math" x="500" y="466" text-anchor="middle" font-size="24"><tspan font-weight="700">x</tspan><tspan> = [ </tspan><tspan font-weight="700">t</tspan><tspan baseline-shift="sub" font-size="14">x</tspan><tspan baseline-shift="baseline">, </tspan><tspan font-weight="700">t</tspan><tspan baseline-shift="sub" font-size="14">y</tspan><tspan baseline-shift="baseline">, </tspan><tspan font-weight="700">t</tspan><tspan baseline-shift="sub" font-size="14">z</tspan><tspan baseline-shift="baseline">, α, β, γ ]</tspan><tspan baseline-shift="super" font-size="14">T</tspan></text>
</svg>
