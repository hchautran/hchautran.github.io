<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">Position and orientation of a quadruped robot</title>
  <desc id="desc">A fixed world frame is connected to a body frame on a quadruped robot by a translation vector, with roll, pitch, and yaw shown about the body axes.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".14"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <marker id="axis-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/></marker>
    <marker id="axis-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="axis-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fb7185"/></marker>
    <marker id="axis-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker>
  </defs>

  <rect width="960" height="510" rx="20" fill="url(#panel)"/>
  <circle cx="640" cy="250" r="260" fill="url(#halo)"/>
  <text x="48" y="52" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">A 3D pose has six degrees of freedom</text>
  <text x="48" y="83" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">Three locate the body frame. Three determine how it is oriented.</text>

  <!-- Robot render -->
  <image x="348" y="78" width="576" height="384" preserveAspectRatio="xMidYMid meet" href="quadruped-robot-cutout.png" xlink:href="quadruped-robot-cutout.png"/>

  <!-- World frame -->
  <g transform="translate(135 380)" font-family="system-ui, sans-serif">
    <circle r="6" fill="#f8fafc"/>
    <line x1="0" y1="0" x2="112" y2="0" stroke="#22c55e" stroke-width="4" marker-end="url(#axis-green)"/>
    <line x1="0" y1="0" x2="0" y2="-108" stroke="#38bdf8" stroke-width="4" marker-end="url(#axis-blue)"/>
    <line x1="0" y1="0" x2="-61" y2="61" stroke="#fb7185" stroke-width="4" marker-end="url(#axis-red)"/>
    <text x="124" y="7" font-size="22" font-style="italic" fill="#86efac">x<tspan baseline-shift="sub" font-size="13">W</tspan></text>
    <text x="-7" y="-120" font-size="22" font-style="italic" fill="#7dd3fc">y<tspan baseline-shift="sub" font-size="13">W</tspan></text>
    <text x="-86" y="82" font-size="22" font-style="italic" fill="#fda4af">z<tspan baseline-shift="sub" font-size="13">W</tspan></text>
    <text x="-31" y="105" font-size="18" font-weight="700" fill="#e2e8f0">World W</text>
  </g>

  <!-- Translation from world origin to body origin -->
  <line x1="143" y1="376" x2="598" y2="220" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#axis-amber)"/>
  <text x="320" y="302" font-family="system-ui, sans-serif" font-size="17" font-weight="650" fill="#fde68a">position</text>

  <!-- Body frame -->
  <g transform="translate(610 216)" font-family="system-ui, sans-serif">
    <circle r="7" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <line x1="0" y1="0" x2="-102" y2="48" stroke="#22c55e" stroke-width="5" marker-end="url(#axis-green)"/>
    <line x1="0" y1="0" x2="91" y2="64" stroke="#38bdf8" stroke-width="5" marker-end="url(#axis-blue)"/>
    <line x1="0" y1="0" x2="0" y2="-112" stroke="#fb7185" stroke-width="5" marker-end="url(#axis-red)"/>
    <text x="-128" y="63" font-size="22" font-style="italic" fill="#86efac">x<tspan baseline-shift="sub" font-size="13">B</tspan></text>
    <text x="100" y="79" font-size="22" font-style="italic" fill="#7dd3fc">y<tspan baseline-shift="sub" font-size="13">B</tspan></text>
    <text x="9" y="-117" font-size="22" font-style="italic" fill="#fda4af">z<tspan baseline-shift="sub" font-size="13">B</tspan></text>
  </g>
  <rect x="532" y="163" width="80" height="30" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="572" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Body B</text>

  <!-- Rotation arcs -->
  <path d="M487 227 C462 195 477 164 511 160" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#axis-green)"/>
  <rect x="418" y="145" width="60" height="29" rx="8" fill="#0f172a" stroke="#22c55e"/>
  <text x="448" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#86efac">roll</text>

  <path d="M703 239 C739 265 772 242 764 208" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#axis-blue)"/>
  <rect x="760" y="216" width="72" height="29" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="796" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#7dd3fc">pitch</text>

  <path d="M574 116 C590 87 628 86 646 113" fill="none" stroke="#fb7185" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#axis-red)"/>
  <rect x="647" y="84" width="62" height="29" rx="8" fill="#0f172a" stroke="#fb7185"/>
  <text x="678" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fda4af">yaw</text>

  <line x1="48" y1="472" x2="912" y2="472" stroke="#334155" stroke-width="1"/>
  <text x="480" y="494" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">translation: x, y, z  ·  rotation: roll, pitch, yaw</text>
</svg>
