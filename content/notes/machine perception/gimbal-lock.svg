<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t d">
<title id="t">Gimbal lock at ninety-degree pitch</title><desc id="d">Before and after sketches show independent rotation rings becoming aligned.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker><style>@font-face{font-family:Excalifont;src:url("Excalifont-Latin.woff2")}@font-face{font-family:Excalifont;src:url("Excalifont-Greek.woff2")}.i{fill:none;stroke:#1e1e1e;stroke-width:2;stroke-linecap:round}.n{font:20px Excalifont,"Comic Sans MS",sans-serif;fill:#1e1e1e}.blue{fill:none;stroke:#228be6;stroke-width:2}.red{fill:none;stroke:#fa5252;stroke-width:2;stroke-dasharray:5 5}</style></defs>
<rect width="960" height="430" fill="#fffefb"/><text class="n" x="45" y="43" font-size="25">Gimbal lock: two angle controls become the same control</text>
<text class="n" x="173" y="91">ordinary orientation</text><g transform="translate(260 242)"><ellipse class="i" rx="126" ry="53" transform="rotate(-17)"/><ellipse class="blue" rx="56" ry="126" transform="rotate(29)"/><ellipse class="red" rx="97" ry="97"/><path class="i" d="M0 0L96-67" marker-end="url(#a)"/><path class="i" d="M0 0L-106-15" marker-end="url(#a)"/><path class="i" d="M0 0L17-119" marker-end="url(#a)"/></g><text class="n" x="151" y="392" fill="#175cff">3 independent directions</text>
<path class="i" d="M425 241L527 241" marker-end="url(#a)"/><text x="448" y="216" font-family="Georgia,serif" font-size="21" fill="#1e1e1e">β = π/2</text>
<text class="n" x="656" y="91">singular orientation</text><g transform="translate(720 242)"><ellipse class="i" rx="127" ry="53"/><circle class="blue" r="100"/><circle class="red" r="107"/><path class="i" d="M-6 0L-6-127" marker-end="url(#a)"/><path class="i" d="M7 0L7-127" marker-end="url(#a)"/></g><text class="n" x="630" y="392" fill="#ef2b2d">roll axis = yaw axis</text><path d="M694 404l19 17m0-17-19 17" stroke="#ef2b2d" stroke-width="3"/>
</svg>
