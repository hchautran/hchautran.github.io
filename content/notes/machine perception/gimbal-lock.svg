<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Euler angle gimbal lock</title>
  <desc id="desc">Independent roll pitch yaw axes before gimbal lock and aligned roll yaw axes at the singular pitch.</desc>
  <defs>
    <marker id="axis-r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <marker id="axis-g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="axis-b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="960" height="480" rx="18" fill="#f8fafc"/>
  <text x="480" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Gimbal lock: the coordinates lose a degree of freedom</text>
  <g font-family="system-ui, sans-serif">
    <text x="240" y="92" text-anchor="middle" font-size="22" font-weight="650" fill="#334155">General orientation</text>
    <g transform="translate(240 280)">
      <circle r="78" fill="none" stroke="#dc2626" stroke-width="5"/>
      <ellipse rx="118" ry="44" fill="none" stroke="#16a34a" stroke-width="5" transform="rotate(-18)"/>
      <ellipse rx="48" ry="114" fill="none" stroke="#2563eb" stroke-width="5" transform="rotate(32)"/>
      <line x1="0" y1="0" x2="105" y2="-70" stroke="#dc2626" stroke-width="4" marker-end="url(#axis-r)"/>
      <line x1="0" y1="0" x2="-112" y2="-18" stroke="#16a34a" stroke-width="4" marker-end="url(#axis-g)"/>
      <line x1="0" y1="0" x2="22" y2="-120" stroke="#2563eb" stroke-width="4" marker-end="url(#axis-b)"/>
    </g>
    <text x="720" y="92" text-anchor="middle" font-size="22" font-weight="650" fill="#334155">Pitch = 90°</text>
    <g transform="translate(720 280)">
      <circle r="82" fill="none" stroke="#dc2626" stroke-width="6"/>
      <ellipse rx="122" ry="43" fill="none" stroke="#16a34a" stroke-width="5"/>
      <circle r="94" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="10 8"/>
      <line x1="0" y1="0" x2="0" y2="-124" stroke="#dc2626" stroke-width="5" marker-end="url(#axis-r)"/>
      <line x1="8" y1="0" x2="8" y2="-124" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#axis-b)"/>
    </g>
    <text x="720" y="432" text-anchor="middle" font-size="19" fill="#475569">roll and yaw axes coincide</text>
    <text x="240" y="432" text-anchor="middle" font-size="19" fill="#475569">three locally independent axes</text>
  </g>
</svg>

