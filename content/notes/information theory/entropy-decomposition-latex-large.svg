<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Entropy decomposition and mutual information</title>
  <desc id="desc">Two overlapping hand-drawn sets show conditional entropies in the outer regions and mutual information in the overlap.</desc>
  <defs>
    <style>@font-face{font-family:Excalifont;src:url("../machine-perception/Excalifont-Latin.woff2")}.h{font-family:Excalifont,"Comic Sans MS",sans-serif;fill:#1e1e1e}.m{font-family:Georgia,"Times New Roman",serif;fill:#1e1e1e;font-style:italic}.i{fill:none;stroke:#1e1e1e;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style>
    <clipPath id="right-set"><path d="M452 127C561 109 638 150 649 251C659 340 605 384 520 386C423 389 367 337 371 258C374 190 398 142 452 127Z"/></clipPath>
  </defs>
  <rect width="920" height="560" fill="#fffefb"/>
  <text class="h" x="42" y="46" font-size="26">Mutual information · shared uncertainty</text>
  <text class="h" x="42" y="77" font-size="18" fill="#555">The overlap is what knowing either variable tells us about the other.</text>
  <g>
    <path d="M182 255C183 151 256 111 365 124C442 133 473 187 468 258C462 340 399 389 300 383C219 378 180 332 182 255Z" fill="#dbeafe" opacity=".72"/>
    <path d="M452 127C561 109 638 150 649 251C659 340 605 384 520 386C423 389 367 337 371 258C374 190 398 142 452 127Z" fill="#ffe3e3" opacity=".72"/>
    <path class="i" d="M182 255C183 151 256 111 365 124C442 133 473 187 468 258C462 340 399 389 300 383C219 378 180 332 182 255Z"/>
    <path class="i" d="M452 127C561 109 638 150 649 251C659 340 605 384 520 386C423 389 367 337 371 258C374 190 398 142 452 127Z"/>
    <path d="M182 255C183 151 256 111 365 124C442 133 473 187 468 258C462 340 399 389 300 383C219 378 180 332 182 255Z" fill="#d0bfff" opacity=".9" clip-path="url(#right-set)"/>
    <text class="math" x="240" y="112" font-size="24">H(X)</text><text class="math" x="554" y="112" font-size="24">H(Y)</text>
    <text class="math" x="226" y="259" font-size="21">H(X|Y)</text><text class="math" x="520" y="259" font-size="21">H(Y|X)</text>
    <text class="math" x="385" y="249" font-size="22">I(X;Y)</text>
    <text class="h" x="387" y="278" font-size="17" fill="#7950f2">shared</text>
    <path d="M178 405C306 414 493 410 654 403" fill="none" stroke="#adb5bd" stroke-width="1.3"/>
    <text class="math" x="335" y="440" font-size="22">H(X,Y) = union</text>
  </g>
  <g transform="translate(168 488)">
    <text class="math" x="0" y="0" font-size="22">I(X;Y) = H(X) − H(X|Y) = H(Y) − H(Y|X)</text>
    <text class="math" x="97" y="34" font-size="22">= H(X) + H(Y) − H(X,Y)</text>
  </g>
</svg>
