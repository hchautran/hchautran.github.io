<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title desc" data-notation="latex-large">
  <title id="title">Relationship among entropy, conditional entropy, and mutual information</title>
  <desc id="desc">Two overlapping circles represent the entropy of X and Y. Their overlap is mutual information, and their non-overlapping regions are conditional entropies.</desc>
  <rect width="760" height="410" rx="16" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#243746">Decomposing joint entropy</text>

  <defs>
    <clipPath id="left-circle"><circle cx="300" cy="210" r="135"/></clipPath>
  </defs>

  <circle cx="300" cy="210" r="135" fill="#8ecae6" fill-opacity="0.72" stroke="#28799a" stroke-width="3"/>
  <circle cx="460" cy="210" r="135" fill="#f4a261" fill-opacity="0.68" stroke="#b85f25" stroke-width="3"/>
  <circle cx="460" cy="210" r="135" fill="#84a59d" fill-opacity="0.9" clip-path="url(#left-circle)"/>

  <g font-family="system-ui, sans-serif" fill="#243746">
    <text x="380" y="393" text-anchor="middle" font-size="15" fill="#596a73">Joint entropy is the union of both circles</text>
  </g>

  <g stroke="#596a73" stroke-width="1.5" fill="none">
    <path d="M245 344 C245 325 250 315 262 305"/>
    <path d="M515 344 C515 325 510 315 498 305"/>
  </g>
  <image href="data:image/svg+xml;base64," x="0" y="0" width="760" height="410"/>
</svg>
