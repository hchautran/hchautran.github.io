<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Relative entropy for two Bernoulli distributions</title>
  <desc id="desc">Bars compare p and q at outcomes zero and one. A second panel shows D of p parallel q reaching zero when q equals p.</desc>
  <defs>
    <style>@font-face{font-family:Excalifont;src:url("../machine-perception/Excalifont-Latin.woff2")}.h{font-family:Excalifont,"Comic Sans MS",sans-serif;fill:#1e1e1e}.m{font-family:Georgia,"Times New Roman",serif;fill:#1e1e1e;font-style:italic}.i{fill:none;stroke:#1e1e1e;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.g{fill:none;stroke:#adb5bd;stroke-width:1.2;opacity:.55}.p{fill:#dbeafe;stroke:#1971c2;stroke-width:2}.q{fill:#ffe3e3;stroke:#e03131;stroke-width:2}.c{fill:none;stroke:#7950f2;stroke-width:3;stroke-linecap:round}</style>
  </defs>
  <rect width="980" height="560" fill="#fffefb"/>
  <text class="h" x="42" y="46" font-size="26">KL divergence · the cost of using q when data follow p</text>
  <text class="h" x="42" y="77" font-size="18" fill="#555">The order matters: outcomes are weighted by the true distribution p.</text>
  <path d="M490 105C488 220 492 350 490 405" fill="none" stroke="#adb5bd" stroke-width="1.3" stroke-linecap="round"/>

  <text class="h" x="92" y="120" font-size="22">Where do p and q disagree?</text>
  <g transform="translate(100 390)">
    <path class="i" d="M0 0L335 0M0 0L0-235"/>
    <path class="p" d="M55 0L55-24L112-24L112 0Z"/><path class="q" d="M119 0L119-120L176-120L176 0Z"/>
    <path class="p" d="M215 0L215-216L272-216L272 0Z"/><path class="q" d="M279 0L279-120L336-120L336 0Z"/>
    <text class="math" x="93" y="29" text-anchor="middle" font-size="20">x=0</text><text class="math" x="253" y="29" text-anchor="middle" font-size="20">x=1</text>
    <text class="h" x="64" y="-32" font-size="17" fill="#1971c2">p=.1</text><text class="h" x="125" y="-130" font-size="17" fill="#e03131">q=.5</text>
    <text class="h" x="213" y="-224" font-size="17" fill="#1971c2">p=.9</text><text class="h" x="283" y="-130" font-size="17" fill="#e03131">q=.5</text>
  </g>

  <text class="h" x="545" y="120" font-size="22">Hold p=.9 fixed; vary q</text>
  <g transform="translate(550 390)">
    <path class="i" d="M0 0L345 0M0 0L0-235"/>
    <path class="g" d="M0-60C110-61 230-59 345-60M0-120C110-119 230-121 345-120"/>
    <path class="c" d="M18-218C64-141 116-79 170-38C222-2 276-5 332-101"/>
    <path d="M270 0L270-7" stroke="#e03131" stroke-width="2" stroke-dasharray="5 7"/><circle cx="270" cy="-7" r="6" fill="#e03131"/>
    <text class="math" x="259" y="29" font-size="18">.9</text><text class="math" x="330" y="29" font-size="21">q</text>
    <rect x="222" y="-43" width="118" height="28" rx="6" fill="#fffefb"/>
    <text class="h" x="232" y="-22" font-size="18" fill="#e03131">q=p → zero</text>
    <text class="math" x="12" y="-239" font-size="20">D(p ∥ q)</text>
  </g>
  <g transform="translate(264 490)">
    <text class="math" x="0" y="0" font-size="25">D(p ∥ q) =</text>
    <text class="math" x="139" y="2" font-size="34">Σ</text>
    <text class="math" x="135" y="19" font-size="12">x∈𝒳</text>
    <text class="math" x="173" y="0" font-size="25">p(x) log<tspan baseline-shift="sub" font-size="15">2</tspan><tspan baseline-shift="baseline" font-size="25"> [p(x)/q(x)]</tspan></text>
  </g>
  <text class="h" x="364" y="546" font-size="18" fill="#555">here: D(p ∥ q) ≈ 0.531 bits</text>
</svg>
