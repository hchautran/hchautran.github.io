<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Binary entropy</title>
  <desc id="desc">A hand-drawn binary entropy curve, zero at p equals zero and one, and maximal at p equals one half.</desc>
  <defs>
    <style>@font-face{font-family:Excalifont;src:url("../machine-perception/Excalifont-Latin.woff2")}.h{font-family:Excalifont,"Comic Sans MS",sans-serif;fill:#1e1e1e}.m{font-family:Georgia,"Times New Roman",serif;fill:#1e1e1e;font-style:italic}.i{fill:none;stroke:#1e1e1e;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.g{fill:none;stroke:#adb5bd;stroke-width:1.2;stroke-linecap:round;opacity:.55}.b{fill:none;stroke:#1971c2;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-linecap="round"/></marker>
  </defs>
  <rect width="920" height="560" fill="#fffefb"/>
  <text class="h" x="42" y="46" font-size="26">Binary entropy · uncertainty of one coin flip</text>
  <text class="h" x="42" y="77" font-size="18" fill="#555">Certain at the ends; most uncertain when both outcomes are equally likely.</text>
  <g transform="translate(120 418)">
    <path class="g" d="M0-75C170-76 350-74 680-75M0-150C180-151 370-149 680-150M0-225C190-224 380-226 680-225M170 0C169-90 171-180 170-300M340 0C341-95 339-200 340-300M510 0C509-95 511-200 510-300M680 0C681-95 679-200 680-300"/>
    <path class="i" d="M0 0C220 1 450-1 698 0" marker-end="url(#a)"/>
    <path class="i" d="M0 0C-1-100 1-205 0-318" marker-end="url(#a)"/>
    <path class="b" d="M0 0C35-102 101-189 170-238C226-278 284-298 340-300C396-298 454-278 510-238C579-189 645-102 680 0"/>
    <path d="M4 3C40-99 102-185 171-235C225-274 283-294 340-296C397-294 455-274 509-235C578-185 640-99 676 3" fill="none" stroke="#1971c2" stroke-width="1" opacity=".28"/>
    <path d="M340 0C341-100 339-200 340-300" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round"/>
    <circle cx="340" cy="-300" r="6" fill="#e03131"/>
    <rect x="352" y="-307" width="292" height="36" rx="7" fill="#fffefb"/>
    <text class="h" x="362" y="-280" font-size="20" fill="#e03131">maximum uncertainty: 1 bit</text>
    <text class="h" x="-7" y="31" font-size="17">0</text><text class="h" x="328" y="31" font-size="17">1/2</text><text class="h" x="674" y="31" font-size="17">1</text>
    <text class="h" x="-29" y="7" font-size="17">0</text><text class="h" x="-29" y="-293" font-size="17">1</text>
    <text class="math" x="712" y="8" font-size="23">p</text>
    <text class="math" x="-64" y="-138" font-size="23" transform="rotate(-90 -64 -138)">H(p)</text>
  </g>
  <g transform="translate(198 510)">
    <text class="math" x="0" y="0" font-size="25">H(X) = H(p) = −p log<tspan baseline-shift="sub" font-size="15">2</tspan><tspan baseline-shift="baseline" font-size="25"> p − (1−p) log</tspan><tspan baseline-shift="sub" font-size="15">2</tspan><tspan baseline-shift="baseline" font-size="25"> (1−p)</tspan></text>
  </g>
</svg>
