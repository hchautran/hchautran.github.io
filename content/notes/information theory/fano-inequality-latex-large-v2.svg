<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" role="img" aria-labelledby="title desc">
  <title id="title">Fano's inequality and estimation error</title>
  <desc id="desc">The true class X produces an observation Y, from which an estimator forms X hat. A comparator marks whether X hat differs from X.</desc>
  <defs>
    <style>@font-face{font-family:Excalifont;src:url("../machine-perception/Excalifont-Latin.woff2")}.h{font-family:Excalifont,"Comic Sans MS",sans-serif;fill:#1e1e1e}.m{font-family:Georgia,"Times New Roman",serif;fill:#1e1e1e;font-style:italic}.i{fill:none;stroke:#1e1e1e;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.r{fill:none;stroke:#e03131;stroke-width:2.5;stroke-linecap:round}</style>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-linecap="round"/></marker>
    <marker id="ra" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#e03131" stroke-width="1.5" stroke-linecap="round"/></marker>
  </defs>
  <rect width="980" height="580" fill="#fffefb"/>
  <text class="h" x="42" y="46" font-size="26">Fano's inequality · uncertainty forces estimation errors</text>
  <text class="h" x="42" y="77" font-size="18" fill="#555">An estimator cannot recover distinctions that the observation never revealed.</text>

  <g transform="translate(82 140)">
    <path d="M0 0C45-3 111 3 154 0C157 48 151 105 155 153C105 156 47 150 0 154C-3 103 3 49 0 0Z" fill="#dbeafe" stroke="#1e1e1e" stroke-width="2.3"/>
    <text class="h" x="43" y="60" font-size="20">true class</text><text class="math" x="68" y="105" font-size="34">X</text>
  </g>
  <path class="i" d="M254 216C290 214 320 215 351 216" marker-end="url(#a)"/>
  <g transform="translate(372 140)">
    <path d="M0 0C45-3 111 3 154 0C157 48 151 105 155 153C105 156 47 150 0 154C-3 103 3 49 0 0Z" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2.3"/>
    <text class="h" x="32" y="60" font-size="20">observation</text><text class="math" x="67" y="105" font-size="34">Y</text>
  </g>
  <path class="i" d="M545 216C581 214 610 215 642 216" marker-end="url(#a)"/>
  <text class="math" x="565" y="196" font-size="18">g(Y)</text>
  <g transform="translate(664 140)">
    <path d="M0 0C45-3 111 3 154 0C157 48 151 105 155 153C105 156 47 150 0 154C-3 103 3 49 0 0Z" fill="#f3d9fa" stroke="#1e1e1e" stroke-width="2.3"/>
    <text class="h" x="38" y="60" font-size="20">estimate</text><text class="math" x="61" y="105" font-size="34">X̂</text>
  </g>

  <path class="r" d="M160 312C249 364 347 379 448 380C567 381 691 354 742 313" marker-end="url(#ra)"/>
  <g transform="translate(404 345)">
    <path d="M0 0C51-3 116 3 165 0C168 32 162 70 166 101C111 105 49 99 0 103C-3 68 3 33 0 0Z" fill="#ffe3e3" stroke="#e03131" stroke-width="2.2"/>
    <text class="math" x="20" y="43" font-size="23">E = 1{X̂ ≠ X}</text>
    <text class="math" x="20" y="76" font-size="21">P<tspan baseline-shift="sub" font-size="13">e</tspan><tspan> = Pr(X̂ ≠ X)</tspan></text>
  </g>
  <text class="h" x="590" y="405" font-size="18" fill="#e03131">compare truth with estimate</text>
  <text class="math" x="112" y="510" font-size="23">H(P<tspan baseline-shift="sub" font-size="14">e</tspan><tspan>) + P</tspan><tspan baseline-shift="sub" font-size="14">e</tspan><tspan> log</tspan><tspan baseline-shift="sub" font-size="14">2</tspan><tspan> |𝒳| ≥ H(X|X̂) ≥ H(X|Y)</tspan></text>
  <text class="math" x="244" y="552" font-size="21">H(X|Y) ≤ H(P<tspan baseline-shift="sub" font-size="13">e</tspan><tspan>) + P</tspan><tspan baseline-shift="sub" font-size="13">e</tspan><tspan> log</tspan><tspan baseline-shift="sub" font-size="13">2</tspan><tspan> (|𝒳|−1)</tspan></text>
</svg>
