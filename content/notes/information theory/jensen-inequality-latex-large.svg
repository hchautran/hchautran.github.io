<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Jensen's inequality for a convex function</title>
  <desc id="desc">A convex curve lies below the chord joining two points. The function at the mean is below the mean of the function values.</desc>
  <defs>
    <style>@font-face{font-family:Excalifont;src:url("../machine-perception/Excalifont-Latin.woff2")}.h{font-family:Excalifont,"Comic Sans MS",sans-serif;fill:#1e1e1e}.m{font-family:Georgia,"Times New Roman",serif;fill:#1e1e1e;font-style:italic}.i{fill:none;stroke:#1e1e1e;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.b{fill:none;stroke:#1971c2;stroke-width:3;stroke-linecap:round}.r{fill:none;stroke:#e03131;stroke-width:2.5;stroke-linecap:round}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#1e1e1e" stroke-width="1.5"/></marker>
  </defs>
  <rect width="920" height="500" fill="#fffefb"/>
  <text class="h" x="42" y="46" font-size="26">Jensen's inequality · average first, or apply f first?</text>
  <text class="h" x="42" y="78" font-size="18" fill="#555">For a convex function, the chord stays above the curve.</text>
  <g transform="translate(118 380)">
    <path class="i" d="M0 0C195 1 390-1 610 0" marker-end="url(#a)"/><path class="i" d="M0 0C-1-90 1-185 0-280" marker-end="url(#a)"/>
    <!-- A quadratic Bezier with increasing slope: a genuinely convex parabola. -->
    <path class="b" d="M45-30Q296-30 548-288"/>
    <path d="M85-32L498-242" fill="none" stroke="#e03131" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="85" cy="-32" r="6" fill="#e03131"/><circle cx="498" cy="-242" r="6" fill="#e03131"/>
    <circle cx="291.5" cy="-137" r="6" fill="#e03131"/><circle cx="291.5" cy="-92" r="6" fill="#1971c2"/>
    <path d="M291.5-131L291.5-98" fill="none" stroke="#7950f2" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M291.5 0L291.5-86" fill="none" stroke="#7950f2" stroke-width="1.8" stroke-dasharray="5 7"/>
    <text class="math" x="68" y="24" font-size="19">x<tspan baseline-shift="sub" font-size="12">1</tspan></text><text class="math" x="481" y="24" font-size="19">x<tspan baseline-shift="sub" font-size="12">2</tspan></text>
    <text class="math" x="266" y="24" font-size="18">E[X]</text>
    <text class="h" x="575" y="-278" font-size="18" fill="#1971c2">convex f</text>
    <!-- A separate annotation lane prevents labels from crossing the plot. -->
    <text class="h" x="575" y="-190" font-size="17">midpoint values</text>
    <circle cx="582" cy="-158" r="5" fill="#e03131"/><text class="math" x="598" y="-152" font-size="18" fill="#e03131">E[f(X)]</text>
    <circle cx="582" cy="-116" r="5" fill="#1971c2"/><text class="math" x="598" y="-110" font-size="18" fill="#1971c2">f(E[X])</text>
  </g>
  <text class="math" x="254" y="460" font-size="28">f(E[X]) ≤ E[f(X)]</text>
</svg>
