<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">The data-processing inequality</title>
  <desc id="desc">A scene passes through a camera image and then a thumbnail. The Markov chain X to Y to Z loses information downstream.</desc>
  <defs>
    <style>@font-face{font-family:Excalifont;src:url("../machine-perception/Excalifont-Latin.woff2")}.h{font-family:Excalifont,"Comic Sans MS",sans-serif;fill:#1e1e1e}.m{font-family:Georgia,"Times New Roman",serif;fill:#1e1e1e;font-style:italic}.i{fill:none;stroke:#1e1e1e;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.b{fill:none;stroke:#1971c2;stroke-width:2.6;stroke-linecap:round}</style>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-linecap="round"/></marker>
  </defs>
  <rect width="920" height="500" fill="#fffefb"/>
  <text class="h" x="42" y="46" font-size="26">Data processing · information can be discarded, not created</text>
  <text class="h" x="42" y="77" font-size="18" fill="#555">Each stage only receives what survived the previous stage.</text>

  <g transform="translate(90 135)">
    <path d="M0 10C1-6 15-13 31-8C45-27 79-29 94-5C115-8 130 4 128 24L128 116C128 132 115 140 99 139L25 139C8 140-2 127 0 111Z" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2.2"/>
    <path class="i" d="M13 107L47 74L68 91L95 54L116 78M27 34C27 25 34 19 43 20C51 20 57 27 57 35C57 43 50 49 42 49C34 49 27 43 27 34Z"/>
    <text class="math" x="55" y="171" font-size="26">X</text><text class="h" x="35" y="198" font-size="18">scene</text>
  </g>
  <path class="i" d="M236 210C281 208 307 209 347 210" marker-end="url(#a)"/>
  <g transform="translate(366 132)">
    <path d="M0 0C46-2 101 2 149 0C152 48 147 104 150 149C100 151 49 147 0 150C-2 100 2 50 0 0Z" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2.2"/>
    <path class="i" d="M16 126L54 85L78 105L109 65L135 91M30 39C30 29 38 22 47 22C57 22 64 30 64 39C64 49 57 56 47 56C38 56 30 49 30 39Z"/>
    <text class="math" x="67" y="179" font-size="26">Y</text><text class="h" x="38" y="206" font-size="18">sensor image</text>
  </g>
  <path class="i" d="M535 210C579 208 609 209 650 210" marker-end="url(#a)"/>
  <g transform="translate(674 163)">
    <path d="M0 0C31-1 67 1 99 0C101 31 98 66 100 99C67 101 32 98 0 100C-1 67 1 33 0 0Z" fill="#f3d9fa" stroke="#1e1e1e" stroke-width="2.2"/>
    <path class="i" d="M11 84L37 57L52 70L72 44L90 62M20 26C20 20 25 15 31 15C37 15 42 20 42 26C42 32 37 37 31 37C25 37 20 32 20 26Z"/>
    <text class="math" x="42" y="129" font-size="26">Z</text><text class="h" x="17" y="156" font-size="18">thumbnail</text>
  </g>
  <text class="h" x="322" y="380" font-size="19" fill="#e03131">lost detail cannot reappear downstream</text>
  <path d="M371 387C440 398 535 397 599 386" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linecap="round"/>
  <text class="math" x="242" y="430" font-size="24">p(x,y,z) = p(x)p(y|x)p(z|y)</text>
  <text class="math" x="250" y="475" font-size="27">X → Y → Z   ⟹   I(X;Z) ≤ I(X;Y)</text>
</svg>
